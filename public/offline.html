<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>ePoster · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}
    main{width:min(100%,520px);padding:32px;border:1px solid #e2e8f0;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px #0f172a0d}
    .icon{display:grid;place-items:center;margin:0 auto 20px;width:64px;height:64px;border-radius:18px;background:#fff7ed;color:#c2410c;font-size:30px}
    h1{margin:0;font-size:28px}p{line-height:1.7;color:#64748b}a,button{display:inline-block;margin:8px 4px 0;padding:12px 16px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}
    a.secondary{background:#f1f5f9;color:#334155}
  </style>
</head>
<body><main>
  <div class="icon">↯</div>
  <h1>You’re offline</h1>
  <p>This page hasn’t been saved on this device yet. Reconnect to the internet and open the ePoster pages you need so they can be available offline next time.</p>
  <button onclick="location.reload()">Try again</button>
  <a class="secondary" href="/">Home</a>
</main></body>
</html>
